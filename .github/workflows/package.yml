name: Package

# Builds the package the way a release would, without uploading it, and
# checks that what's inside is what the game needs and nothing else.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the package
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Check what's in it
        run: |
          # On a commit that carries a release tag the packager builds
          # nothing here, and leaves it to the release run for that tag.
          zip="$(ls .release/*.zip 2>/dev/null | head -n 1)"
          if [ -z "$zip" ]; then
            echo "Nothing was built: this commit is tagged, so the release run packages it."
            exit 0
          fi
          echo "Built $zip"
          unzip -Z1 "$zip" > "$RUNNER_TEMP/files.txt"

          if grep -v '^Strikewise/' "$RUNNER_TEMP/files.txt"; then
            echo "::error::Everything should be under Strikewise/."
            exit 1
          fi
          if grep -E '^Strikewise/(docs/|stylua\.toml|\.)' "$RUNNER_TEMP/files.txt"; then
            echo "::error::Files that are only for development got into the package."
            exit 1
          fi

          # Every file the TOC loads has to be there, or the game stops
          # at the first one that's missing.
          unzip -p "$zip" Strikewise/Strikewise.toc | tr -d '\r' | tr '\' '/' \
            | grep -v -e '^#' -e '^$' > "$RUNNER_TEMP/listed.txt"
          missing=0
          while read -r file; do
            if ! grep -qxF "Strikewise/$file" "$RUNNER_TEMP/files.txt"; then
              echo "::error::The TOC lists $file, which isn't in the package."
              missing=1
            fi
          done < "$RUNNER_TEMP/listed.txt"
          echo "$(wc -l < "$RUNNER_TEMP/listed.txt") files listed in the TOC"
          exit "$missing"
