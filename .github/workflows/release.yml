name: Release

# Pushing a tag such as v0.3.0-beta packages the addon and publishes it:
# as a release here, and on CurseForge and Wago once the project IDs are in
# the TOC and the upload tokens are saved as repository secrets. A site
# with no ID or no token is skipped.
#
# Work happens on dev. main only moves when there's a release, so what's on
# main is always what the addon sites are handing out.
#
#   1. On dev, set "## Version" in Temper.toc and rename the changelog's
#      "Unreleased" section to that version.
#   2. Merge dev into main.
#   3. git tag v<version> && git push origin main v<version>
#
# A tag with "beta" or "alpha" in it is published as that everywhere, and
# most addon managers hide those from people who haven't asked for them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The packager reads the history, so fetch all of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases come from main. A tag on anything else is a mistake.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Merge dev into main first."
            exit 1
          fi

      # The version the game shows comes from the TOC, so a tag that
      # disagrees with it would put a mislabelled addon in people's hands.
      - name: Check the tag against the TOC
        run: |
          version="${GITHUB_REF_NAME#v}"
          toc="$(sed -n 's/^## Version: *//p' Temper.toc | tr -d '\r')"
          if [ "$version" != "$toc" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the TOC, which says $toc."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Done before anything is uploaded, so a forgotten changelog entry
      # stops the release instead of following it out. Kept outside the
      # checkout so it can't end up in the package.
      - name: Pick this version's notes out of the changelog
        run: |
          awk -v version="$VERSION" '
            /^## / { wanted = ($2 == version); next }
            wanted
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      # What goes in the package is set in .pkgmeta.
      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ github.token }}

      # The sites get the whole changelog. Here, just this version's part.
      - name: Put this version's notes on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --title "Temper $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
